name: build-engine

# Builds the four engine DLLs this plugin ships at vendor/qwentts_cpp/lib/
# (ggml-base, ggml-cpu, ggml, qwen) from the exact upstream sources vendored
# under third_party/qwentts.cpp/ (ServeurpersoCom/qwentts.cpp @ 6fae92914045
# cd83364d2845ceaa0f7969727319, CPU backend only — the CUDA runtime is a
# separate download pack), then emits GitHub build provenance for the
# vendored DLLs so the Hermes plugin catalog can verify them with:
#
#   gh attestation verify <file> --repo LuuMoss/yache-local-voice \
#       --source-digest <pinned-commit-sha> \
#       --predicate-type https://slsa.dev/provenance/v1
#
# third_party/qwentts.cpp/tools/version.cmake carries one fork patch that
# lets CI inject the exact revision/date without a .git directory, keeping
# the qt_version() handshake byte-identical to the upstream build. The
# sanity-check step below enforces that handshake on the fresh build.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "engine-v*"

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  QT_REVISION: 6fae92914045cd83364d2845ceaa0f7969727319
  QT_DATE: "2026-09-28"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pin CMake 4.x + Ninja from PyPI: the MSVC-bundled cmake 3.31.6-msvc6
      # shipped on the Windows images dies with STATUS_STACK_BUFFER_OVERRUN
      # (0xC0000409) during ggml's ASM compiler ABI detection. Verified on a
      # real host 2026-11-22; cmake 4.4.5 configures and builds clean.
      - name: install pinned cmake + ninja
        run: python -m pip install --quiet cmake==4.4.5 ninja

      - name: configure
        run: >
          cmake -S third_party/qwentts.cpp -B build -A x64
          -DQWEN_SHARED=ON -DGGML_NATIVE=OFF
          -DQT_REVISION="$QT_REVISION" -DQT_DATE="$QT_DATE"

      - name: build
        run: cmake --build build --config Release --parallel 4

      - name: sanity-check fresh DLLs (qt_version handshake)
        run: |
          python - <<'PY'
          import ctypes, os, pathlib
          dll = next(p for p in pathlib.Path('build').rglob('qwen.dll'))
          print('fresh build at', dll)
          os.add_dll_directory(str(dll.parent.resolve()))
          lib = ctypes.CDLL(str(dll))
          lib.qt_version.restype = ctypes.c_char_p
          v = lib.qt_version().decode()
          print('fresh qwen.dll qt_version =', v)
          assert v.split()[0] == os.environ['QT_REVISION'], 'version handshake mismatch'
          PY

      - name: collect fresh DLLs + checksums vs vendored
        run: |
          mkdir -p dist
          for f in ggml-base ggml-cpu ggml qwen; do
            src=$(find build -ipath "*release*" -iname "$f.dll" | head -1)
            [ -n "$src" ] || { echo "missing $f.dll in build output" >&2; exit 1; }
            cp "$src" "dist/$f.dll"
          done
          sha256sum dist/*.dll vendor/qwentts_cpp/lib/*.dll

      - name: upload fresh build (transparency)
        uses: actions/upload-artifact@v4
        with:
          name: engine-dlls-fresh
          path: dist/

      - name: attest vendored DLLs (catalog gate)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            vendor/qwentts_cpp/lib/ggml-base.dll
            vendor/qwentts_cpp/lib/ggml-cpu.dll
            vendor/qwentts_cpp/lib/ggml.dll
            vendor/qwentts_cpp/lib/qwen.dll

  # ------------------------------------------------------------------
  # CUDA runtime pack: the GPU option the plugin offers is a zip of the
  # SAME engine sources built with -DGGML_CUDA=ON plus three NVIDIA
  # redistributable DLLs (cudart / cublas / cublasLt).  Building the five
  # engine DLLs here keeps every binary this plugin distributes traceable
  # to third_party/qwentts.cpp; the NVIDIA DLLs are copied verbatim from
  # the NVIDIA-published conda packages (NVIDIA's own signed
  # redistributables, see NOTICE.md).
  # The resulting yache-cuda-windows-x64.zip is the exact asset
  # dashboard/download.py pins by tag + sha256 + byte size.
  #
  # The Windows GitHub runners ship NO CUDA toolkit, and NVIDIA's `nvidia`
  # conda channel is a dead end for 12.4 on win-64: the 12.4.131 .tar.bz2
  # build is a dead stub (empty deps) and the solver silently substitutes
  # CUDA 13.3 .conda builds under a "12.4" version label (observed live:
  # nvcc self-reports release 13.3, compute_61 rejected -- CUDA 13 dropped
  # Pascal).  So the toolkit is assembled instead from NVIDIA's official
  # redist archives (developer.download.nvidia.com, sha256 pinned below
  # from NVIDIA's own redistrib_12.4.1.json index), flattened into one
  # portable tree.  MSVC cl 19.44 (windows-2022) is drifted past CUDA
  # 12.4's clamp, hence
  # -allow-unsupported-compiler; no GPU exists on the runner, so fatbin
  # generator is Ninja (NOT the VS generator: CMake's VS CUDA path demands
  # the CUDA MSBuild integration, which NVIDIA's conda packages do not
  # ship; Ninja + msvc-dev-cmd + CUDAToolkit_ROOT needs no integration).
  # Fatbin targets are pinned explicitly.  CUDA 12.4 matches the NVIDIA runtime
  # DLLs bundled in the pack (and the official llama.cpp cuda-12.4 line,
  # which still supports Pascal sm_61).  CMake 4.4 dropped the legacy
  # "90+PTX" syntax, so the PTX copy uses the -virtual suffix.
  # ------------------------------------------------------------------
  build-cuda-pack:
    # windows-2022 = VS2022 image.  windows-latest now ships VS2026
    # (MSVC 14.5x) whose C++ headers crash CUDA 12.4's cudafe++ frontend
    # with ACCESS_VIOLATION during compiler-id; CUDA 12.4 and VS2022 are
    # the era-matched pair (allow-unsupported-compiler covers the small
    # version drift).  The CPU job keeps plain windows-latest.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CUDA_ARCH_LIST: "61;75;80;86;89;90;90-virtual"
    steps:
      - uses: actions/checkout@v4

      - name: install pinned cmake + ninja
        run: python -m pip install --quiet cmake==4.4.5 ninja

      - name: setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: install CUDA 12.4.1 toolkit (NVIDIA official redist)
        # Three NVIDIA-published archives, sha256-verified, flattened into
        # one portable CUDA root: nvcc (compiler+ptxas+crt+nvvm), cudart
        # (runtime DLL + full headers), libcublas (cublas/cublasLt DLL +
        # headers).  Each zip holds one top dir; its content is merged into
        # $RUNNER_TEMP/cuda-12.4.1 to form a standard toolkit layout.
        run: |
          set -euo pipefail
          TK="$RUNNER_TEMP/cuda-12.4.1"
          BASE=https://developer.download.nvidia.com/compute/cuda/redist
          fetch() {
            local rel="$1" sha="$2" f d
            f=$(basename "$rel")
            curl -fSL --retry 3 -o "$f" "$BASE/$rel"
            echo "$sha  $f" | sha256sum -c -
            rm -rf stage; unzip -q "$f" -d stage
            d=$(find stage -mindepth 1 -maxdepth 1 -type d | head -1)
            cp -a "$d"/. "$TK"/
            rm -rf stage "$f"
          }
          mkdir -p "$TK"
          fetch cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.4.131-archive.zip 3b14cf8dd9dda4a3b1a9682270d46eef775f018e17650187a8a448a06111f2b8
          fetch cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.4.127-archive.zip 6a1c32e68ee1a95ca17334691ff9ad1ffe7f352c24a083d55e4c96b8063b2bcb
          fetch libcublas/windows-x86_64/libcublas-windows-x86_64-12.4.5.8-archive.zip 698140f12da055a3709eee2e022fcfe7bc8edf31f30115e3f7a5c877a9491de5
          # cuda_fp16.h includes <nv/target> -- that header ships in the
          # separate cuda_cccl redist (3 MB of headers, no DLLs).
          fetch cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.4.127-archive.zip 908742d8f3c6fdd6d1d6316a7b919b5c506474f9551f491aa7335cb4f50bffbd
          "$TK/bin/nvcc.exe" --version | tail -1
          echo "CUDA_NVCC=$(cygpath -w "$TK/bin/nvcc.exe")" >> "$GITHUB_ENV"
          echo "CUDA_TK=$(cygpath -w "$TK")" >> "$GITHUB_ENV"

      - name: configure (CUDA backend)
        run: >
          cmake -S third_party/qwentts.cpp -B build-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_COMPILER="$CUDA_NVCC"
          -DQWEN_SHARED=ON -DGGML_NATIVE=OFF -DGGML_CUDA=ON
          -DCUDAToolkit_ROOT="$CUDA_TK"
          -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCH_LIST"
          -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler
          -DQT_REVISION="$QT_REVISION" -DQT_DATE="$QT_DATE"

      - name: build
        run: cmake --build build-cuda --config Release --parallel 4

      - name: upload raw CUDA build (post-mortem insurance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-build-dlls
          path: build-cuda/**/*.dll
          retention-days: 5

      - name: sanity-check fresh CUDA DLLs (qt_version handshake)
        run: |
          python - <<'PY'
          import ctypes, os, pathlib
          dll = next(p for p in pathlib.Path('build-cuda').rglob('qwen.dll'))
          # Ninja (single-config) scatters the build outputs across
          # subdirs — ggml.dll/ggml-base.dll do NOT sit next to qwen.dll
          # the way the VS generator's flat Release/ folder does.  Add
          # every dir that holds a built DLL, plus the redist toolkit's
          # bin (cudart64_12/cublas64_12/cublasLt64_12 for ggml-cuda.dll).
          dirs = {str(p.parent.resolve()) for p in pathlib.Path('build-cuda').rglob('*.dll')}
          dirs.add(str(dll.parent.resolve()))
          tk = os.environ.get('CUDA_TK')
          if tk:
              dirs.add(os.path.join(tk, 'bin'))
          for d in sorted(dirs):
              os.add_dll_directory(d)
          # Staged load, leaf-first: whichever DLL fails first is the real
          # culprit; dumpbin then shows exactly who it wanted.
          import subprocess
          for nm in ('ggml-base.dll', 'ggml-cpu.dll', 'ggml-cuda.dll', 'ggml.dll', 'qwen.dll'):
              hits = list(pathlib.Path('build-cuda').rglob(nm))
              if not hits:
                  print('ARTIFACT MISSING:', nm)
                  continue
              p = hits[0].resolve()
              try:
                  ctypes.CDLL(str(p))
                  print('LOAD OK:', nm)
              except OSError as e:
                  print('LOAD FAIL:', nm, '->', e)
                  subprocess.run(['dumpbin', '/dependents', str(p)])
                  raise
          lib = ctypes.CDLL(str(dll))
          lib.qt_version.restype = ctypes.c_char_p
          v = lib.qt_version().decode()
          print('fresh CUDA qwen.dll qt_version =', v)
          assert v.split()[0] == os.environ['QT_REVISION'], 'version handshake mismatch'
          PY

      - name: assemble yache-cuda-windows-x64.zip
        run: |
          mkdir -p dist-cuda dist-cuda-build
          for f in ggml-base ggml-cpu ggml ggml-cuda qwen; do
            src=$(find build-cuda -iname "$f.dll" | head -1)
            [ -n "$src" ] || { echo "missing $f.dll in build output" >&2; exit 1; }
            cp "$src" "dist-cuda/$f.dll"
          done
          # NVIDIA redistributables straight from the flattened redist
          # toolkit installed above (standard bin/ layout, CUDA_TK export).
          cuda_bin="$CUDA_TK/bin"
          for f in cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
            [ -f "$cuda_bin/$f" ] || { echo "runner toolkit missing $f ($cuda_bin)" >&2; exit 1; }
            cp "$cuda_bin/$f" "dist-cuda/$f"
          done
          python - <<'PY'
          import zipfile
          names = ['qwen.dll','ggml-cuda.dll','ggml-base.dll','ggml-cpu.dll','ggml.dll',
                   'cudart64_12.dll','cublas64_12.dll','cublasLt64_12.dll']
          with zipfile.ZipFile('dist-cuda-build/yache-cuda-windows-x64.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in names: z.write(n, n, compress_type=zipfile.ZIP_DEFLATED)
          PY
          python - <<'PY'
          import zipfile
          names = ['qwen.dll','ggml-cuda.dll','ggml-base.dll','ggml-cpu.dll','ggml.dll',
                   'cudart64_12.dll','cublas64_12.dll','cublasLt64_12.dll']
          with zipfile.ZipFile('dist-cuda-build/yache-cuda-windows-x64.zip') as z:
              for n in names:
                  assert n in z.namelist(), f'zip missing {n}'
          PY
          sha256sum dist-cuda-build/yache-cuda-windows-x64.zip

      - name: upload cuda pack (transparency)
        uses: actions/upload-artifact@v4
        with:
          name: yache-cuda-windows-x64
          path: dist-cuda-build/yache-cuda-windows-x64.zip

      - name: attest cuda pack
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-cuda-build/yache-cuda-windows-x64.zip
