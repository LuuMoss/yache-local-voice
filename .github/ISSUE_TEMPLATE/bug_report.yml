name: Bug report
description: Something broke — help us help you
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out! Before posting, check the
        [existing issues](../issues) and the [Q&A discussions](../discussions/categories/q-a).
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Visible in Settings -> Plugin management, or in the plugin panel footer.
      placeholder: "e.g. 0.3.3"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: OS & Hermes Desktop version
      description: e.g. Windows 11 23H2, Hermes Desktop 0.22.x
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Which part is involved?
      options: [Voice read-aloud (TTS), Voice cloning, Speech-to-text, Wake word, CUDA pack download, Not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log tail
      description: Last ~30 lines of the plugin log (see SUPPORT.md for the path). Paste as-is, Markdown will fence it automatically.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, tokens and private paths/recordings from everything I pasted above.
          required: true
